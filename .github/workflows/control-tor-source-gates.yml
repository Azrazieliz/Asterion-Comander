name: Control embedded Tor source gates
on:
  push:
    branches:
      - work/control-non-ai-tor-20261126
    paths:
      - 'android/**'
      - 'tests/java/com/asterion/control/TorRoutePolicyTest.java'
      - '.github/workflows/control-tor-source-gates.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mkdir -p /tmp/tor-policy
          javac -encoding UTF-8 -d /tmp/tor-policy android/app/src/main/java/com/asterion/control/BrowserNavigationPolicy.java android/app/src/main/java/com/asterion/control/TorRoutePolicy.java tests/java/com/asterion/control/TorRoutePolicyTest.java
          java -cp /tmp/tor-policy com.asterion.control.TorRoutePolicyTest
  android-source:
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Java and merge native dependencies without APK
        working-directory: android
        run: gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac :app:mergeDebugNativeLibs
