name: Control VPN real route evidence source gates
on:
  push:
    branches:
      - work/control-non-ai-vpn-evidence-20261126
      - work/control-security-vpn-reconciled-20261126
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'android/app/src/main/java/com/asterion/control/*Vpn*.java'
      - 'android/app/src/main/java/com/asterion/control/MainActivity.java'
      - 'tests/java/com/asterion/control/VpnEvidencePolicyTest.java'
      - '.github/workflows/control-vpn-evidence-source-gates.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mkdir -p /tmp/vpn-policy
          javac -encoding UTF-8 -d /tmp/vpn-policy android/app/src/main/java/com/asterion/control/VpnEvidencePolicy.java tests/java/com/asterion/control/VpnEvidencePolicyTest.java
          java -cp /tmp/vpn-policy com.asterion.control.VpnEvidencePolicyTest
          javac -encoding UTF-8 -d /tmp/vpn-policy android/app/src/main/java/com/asterion/control/VpnRouteScope.java tests/java/com/asterion/control/VpnRouteScopeTest.java
          java -cp /tmp/vpn-policy com.asterion.control.VpnRouteScopeTest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_vpn_route_policy.py
  android-source:
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile integrated Android source
        working-directory: android
        run: gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac
