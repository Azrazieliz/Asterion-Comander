name: Asterion Control relay recovery regression
on:
  push:
    branches:
      - work/control-0927-overnight-cycles-20261111
    paths:
      - 'asterion_remote/github_bridge.py'
      - 'asterion_remote/github_bridge_git.py'
      - 'scripts/control_repair_watchdog.ps1'
      - 'scripts/start_git_bridge.ps1'
      - 'tests/test_bridge_liveness_watchdog.py'
      - 'tests/test_control_worker_recovery.py'
      - 'tests/test_bridge_dirty_receipt_recovery.py'
      - 'scripts/deploy_private_bridge_recovery_20261116.py'
      - 'scripts/owner_recover_control_relay_once.ps1'
      - 'scripts/owner_hard_reset_private_relay.ps1'
      - 'tests/test_bridge_recovery_deployment.py'
      - '.github/workflows/control-relay-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  windows-relay:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install relay test runner
        run: python -m pip install pytest
      - name: Verify durable command queue, heartbeat, no side-effect replay
        run: python -m pytest -q tests/test_bridge_liveness_watchdog.py tests/test_control_worker_recovery.py tests/test_bridge_dirty_receipt_recovery.py tests/test_bridge_recovery_deployment.py
      - name: Parse Windows watchdog and launcher without executing them
        shell: pwsh
        run: |
          $scripts=@('scripts/control_repair_watchdog.ps1','scripts/start_git_bridge.ps1','scripts/owner_recover_control_relay_once.ps1','scripts/owner_hard_reset_private_relay.ps1')
          foreach($script in $scripts){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count -gt 0){
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell AST syntax check failed: $script"
            }
            Write-Output "POWERSHELL_AST_OK $script"
          }

      - name: Publish independent recovery regression result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        shell: pwsh
        run: |
          $result=if($env:JOB_RESULT -eq 'success'){'success'}else{'failure'}
          $body=@{
            state=$result
            context='asterion/control-relay-recovery'
            description=if($result -eq 'success'){'Relay recovery tests and PowerShell parse passed'}else{'Relay recovery test failed; do not deploy'}
            target_url=('https://github.com/'+$env:GITHUB_REPOSITORY+'/actions/runs/'+$env:GITHUB_RUN_ID)
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method POST -Uri ('https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/statuses/'+$env:GITHUB_SHA) -Headers @{
            Authorization=('Bearer '+$env:GH_TOKEN)
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          } -ContentType 'application/json' -Body $body -TimeoutSec 25 | Out-Null
          Write-Output ('CONTROL_RELAY_RECOVERY_TEST='+$result)
