name: Control security scanner and quarantine gates
on:
  push:
    branches:
      - work/control-non-ai-security-hardening-20261126
    paths:
      - 'asterion_remote/security_scanner.py'
      - 'asterion_remote/control_v2_routes.py'
      - 'tests/test_security_hardening.py'
      - 'tests/test_control_v2.py'
      - '.github/workflows/control-security-hardening-source-gates.yml'
permissions:
  contents: read
jobs:
  scan:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi httpx
      - run: python -m pytest -q tests/test_security_hardening.py tests/test_control_v2.py -k "not model_watch and not skill_approval"
