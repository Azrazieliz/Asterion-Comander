name: Control Model Lab 7B application adaptation
on:
  push:
    branches: [work/control-native-ai-reconstruction-20261126]
    paths:
      - 'scripts/control_ai_stronger_adaptation.py'
      - 'scripts/control_ai_evidence_corpus.py'
      - '.github/workflows/control-ai-stronger-adaptation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapt:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1 bitsandbytes==0.48.2 huggingface-hub==0.34.4 psutil
      - name: Train application curriculum and compare actual generations
        timeout-minutes: 110
        run: python -m scripts.control_ai_stronger_adaptation measured-adaptation --curriculum
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stronger-adaptation-evidence
          path: measured-adaptation/
          if-no-files-found: warn
          retention-days: 7
