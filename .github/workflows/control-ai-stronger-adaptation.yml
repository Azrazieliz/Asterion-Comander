name: Control Model Lab 7B application adaptation
on:
  workflow_dispatch:
    inputs:
      cpu_diagnostic:
        description: 'Explicitly authorize one CPU diagnostic optimizer step; not full curriculum training'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  adapt:
    if: github.event.repository.private == false && inputs.cpu_diagnostic == true
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1 bitsandbytes==0.48.2 huggingface-hub==0.34.4 psutil
      - name: Run explicitly requested one-step CPU diagnostic
        timeout-minutes: 110
        run: python -m scripts.control_ai_stronger_adaptation measured-adaptation --curriculum --device cpu --steps 1 --phase train
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stronger-adaptation-evidence
          path: measured-adaptation/
          if-no-files-found: warn
          retention-days: 7
