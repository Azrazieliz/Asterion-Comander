name: Control private relay partner route regression
on:
  push:
    branches:
      - work/control-0927-overnight-cycles-20261111
    paths:
      - 'asterion_remote/github_bridge.py'
      - 'tests/test_control_native_partner_fallback.py'
      - '.github/workflows/control-native-partner-backport.yml'
  pull_request:
    branches:
      - work/control-0927-overnight-cycles-20261111
    paths:
      - 'asterion_remote/github_bridge.py'
      - 'tests/test_control_native_partner_fallback.py'
      - '.github/workflows/control-native-partner-backport.yml'
permissions:
  contents: read
jobs:
  partner-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi httpx
      - run: python -m pytest -q tests/test_control_native_partner_fallback.py
