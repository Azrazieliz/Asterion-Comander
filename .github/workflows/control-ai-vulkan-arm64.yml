name: Control native ARM64 Vulkan backend
on:
  push:
    branches: [ai-candidate/vulkan-native-20261128]
    paths:
      - '.github/workflows/control-ai-vulkan-arm64.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-vulkan:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 4b77dee0524c64b8471869232e2958bd9589607d
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: e3b1eec08173d6b825cd3ac88c885a63b621504a
          path: vulkan-headers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 29981f65241605e08b0ede4cfeb999fe3b723c6a
          path: spirv-headers
          persist-credentials: false
      - name: Admit existing Android NDK and install host-only shader compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslc ninja-build
          NDK="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          VULKAN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/29/libvulkan.so"
          test -f "$VULKAN"
          echo "ASTERION_NDK=$NDK" >> "$GITHUB_ENV"
          echo "ASTERION_VULKAN_LIBRARY=$VULKAN" >> "$GITHUB_ENV"
          cmake -S spirv-headers -B spirv-build -G Ninja -DCMAKE_INSTALL_PREFIX="$PWD/spirv-install" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --build spirv-build --target install
          find spirv-install -name SPIRV-HeadersConfig.cmake
          glslc --version
      - name: Cross-compile the actual production JNI with Vulkan and CPU in one library
        run: |
          SPIRV_CONFIG="$(find "$PWD/spirv-install" -name SPIRV-HeadersConfig.cmake -print -quit)"
          test -n "$SPIRV_CONFIG"
          cmake -S android/app/src/main/cpp -B arm64-vulkan -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ASTERION_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_SOURCE_DIR="$PWD/runtime" -DGGML_VULKAN=ON \
            -DVulkan_INCLUDE_DIR="$PWD/vulkan-headers/include" \
            -DVulkan_LIBRARY="$ASTERION_VULKAN_LIBRARY" -DVulkan_GLSLC_EXECUTABLE="$(command -v glslc)" \
            -DSPIRV-Headers_DIR="$(dirname "$SPIRV_CONFIG")"
          cmake --build arm64-vulkan --target asterion_llm -j 3
      - name: Verify native ARM64 library, Vulkan linkage and JNI entry points
        run: |
          mkdir -p evidence
          SO="$(find arm64-vulkan -name libasterion_llm.so -type f -print -quit)"
          test -s "$SO"
          READELF="$ASTERION_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h -d -Ws "$SO" > evidence/native-elf.txt
          grep -q AArch64 evidence/native-elf.txt
          grep -q 'Shared library: \[libvulkan.so\]' evidence/native-elf.txt
          grep -q Java_com_asterion_control_OnDeviceLlm_nativeBackendReport evidence/native-elf.txt
          grep -q Java_com_asterion_control_OnDeviceLlm_nativeGenerate evidence/native-elf.txt
          sha256sum "$SO" > evidence/native.sha256
          cp "$SO" evidence/libasterion_llm.so
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path("evidence/libasterion_llm.so")
          report={"abi":"arm64-v8a","android_api":29,"vulkan_linked":True,"cpu_backend_retained":True,"native_library_bytes":p.stat().st_size,"native_library_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"runtime_revision":"4b77dee0524c64b8471869232e2958bd9589607d","vulkan_headers_revision":"e3b1eec08173d6b825cd3ac88c885a63b621504a","spirv_headers_revision":"29981f65241605e08b0ede4cfeb999fe3b723c6a","source_commit":os.environ["GITHUB_SHA"],"physical_gpu_verified":False,"production_promoted":False}
          (Path("evidence")/"build.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Retain native library and build evidence; never package or install APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-arm64-vulkan-native-candidate
          retention-days: 7
          path: evidence/
          if-no-files-found: warn
