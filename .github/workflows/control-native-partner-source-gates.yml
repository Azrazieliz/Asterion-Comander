name: Control native partner transport and queue regression
on:
  push:
    branches:
      - work/control-non-ai-native-partners-20261126
      - 'work/control-non-ai-partner-dispatch-*'
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'asterion_remote/github_bridge.py'
      - 'android/app/src/main/java/com/asterion/control/AppBridge.java'
      - 'android/app/src/main/java/com/asterion/control/PartnerDispatchPolicy.java'
      - 'tests/java/com/asterion/control/PartnerDispatchPolicyTest.java'
      - 'tests/test_control_native_partner_fallback.py'
      - '.github/workflows/control-native-partner-source-gates.yml'
  pull_request:
    branches:
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'asterion_remote/github_bridge.py'
      - 'android/app/src/main/java/com/asterion/control/AppBridge.java'
      - 'android/app/src/main/java/com/asterion/control/PartnerDispatchPolicy.java'
      - 'tests/java/com/asterion/control/PartnerDispatchPolicyTest.java'
      - 'tests/test_control_native_partner_fallback.py'
      - '.github/workflows/control-native-partner-source-gates.yml'
permissions:
  contents: read
jobs:
  native-partners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi httpx
      - run: python -m pytest -q tests/test_control_native_partner_fallback.py tests/test_control_bridge_queue.py tests/test_native_phone_cellular_rpc.py
  android-partner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          mkdir -p /tmp/partner-policy
          javac -encoding UTF-8 -d /tmp/partner-policy android/app/src/main/java/com/asterion/control/PartnerDispatchPolicy.java tests/java/com/asterion/control/PartnerDispatchPolicyTest.java
          java -cp /tmp/partner-policy com.asterion.control.PartnerDispatchPolicyTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Ensure Android 37.0 platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$SDK/platforms/android-37.0/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --channel=3 'platforms;android-37.0' || true
          fi
          test -s "$SDK/platforms/android-37.0/android.jar"
      - name: Compile integrated Android source
        working-directory: android
        run: gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac
