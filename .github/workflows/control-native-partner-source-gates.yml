name: Control native partner transport and queue regression
on:
  push:
    branches:
      - work/control-non-ai-native-partners-20261126
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'asterion_remote/github_bridge.py'
      - 'tests/test_control_native_partner_fallback.py'
      - '.github/workflows/control-native-partner-source-gates.yml'
  pull_request:
    branches:
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'asterion_remote/github_bridge.py'
      - 'tests/test_control_native_partner_fallback.py'
      - '.github/workflows/control-native-partner-source-gates.yml'
permissions:
  contents: read
jobs:
  native-partners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi httpx
      - run: python -m pytest -q tests/test_control_native_partner_fallback.py tests/test_control_bridge_queue.py tests/test_native_phone_cellular_rpc.py
