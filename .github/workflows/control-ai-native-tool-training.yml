name: Continue Control applied native-tool training
on:
  push:
    branches: [ai-candidate/preferred-7b-native-20261128]
    paths: ['.github/workflows/control-ai-native-tool-training.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'
jobs:
  applied-training:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 275
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact verified parent and generate disjoint curriculum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/15243967683/zip" --output preferred.zip
          echo 'b012bdf6c6f9e324c8167507cb32f6a8fd654d48182299a2ab98c9bff2128e3c  preferred.zip' | sha256sum -c -
          python -m pip install huggingface-hub==0.34.4
          python -m scripts.control_ai_preferred_candidate preferred.zip retained --weights
          python -m scripts.control_ai_native_tool_curriculum retained/applied applied-v3
      - name: Install pinned CPU adaptation stack
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 peft==0.17.1 accelerate==1.10.1 bitsandbytes==0.48.2 huggingface-hub==0.34.4 psutil
      - name: Train forty real supervised updates from preference-trained parent
        timeout-minutes: 240
        run: |
          BUDGET="$(python -c 'import psutil;print((psutil.virtual_memory().available-(1024<<20))//(1<<20))')"
          python -m scripts.control_ai_adaptation train --base retained/base --revision 5d19c438a3f72bd74a2b1e1f7aa90e24d359c690 --train applied-v3/train.jsonl --holdout applied-v3/holdout.jsonl --output next-candidate --start-candidate retained/candidate --device cpu --precision nf4 --memory-budget-mib "$BUDGET" --context 384 --rank 8 --accumulate 1 --max-steps 40 --target-modules q_proj,v_proj --threads 4 --save-steps 8 --learning-rate 0.00004
      - name: Preserve actual adapter and safe partial checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applied-native-tool-v3-adapter
          retention-days: 30
          if-no-files-found: warn
          path: |
            next-candidate/candidate.json
            next-candidate/training-plan.json
            next-candidate/adapter/
            next-candidate/checkpoints/*/adapter_model.safetensors
            next-candidate/checkpoints/*/adapter_config.json
            next-candidate/checkpoints/*/trainer_state.json
            applied-v3/
            retained/retained-lineage.json
