name: Control isolated Android non-AI runtime acceptance
on:
  push:
    branches:
      - 'work/control-non-ai-runtime-acceptance-*'
    paths:
      - 'scripts/accept_control_isolated_android_runtime.py'
      - '.github/workflows/control-isolated-android-runtime.yml'
      - 'android/app/src/main/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Enable emulator KVM access on isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure compile platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$SDK/platforms/android-37.0/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --channel=3 'platforms;android-37.0' || true
          fi
          test -s "$SDK/platforms/android-37.0/android.jar"
      - name: Build temporary unsigned-owner debug package for emulator only
        working-directory: android
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Actual app launch, navigation, fixture rendering and browser tab lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            python scripts/accept_control_isolated_android_runtime.py
