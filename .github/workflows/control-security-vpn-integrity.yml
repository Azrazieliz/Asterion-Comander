name: Control VPN and security integrity source gate
on:
  push:
    branches:
      - work/control-non-ai-security-vpn-20261126
    paths:
      - '**/*Vpn*.java'
      - 'asterion_remote/security_scanner.py'
      - 'asterion_remote/control_v2_routes.py'
      - 'tests/test_security_quarantine_integrity.py'
      - '.github/workflows/control-security-vpn-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_security_quarantine_integrity.py
      - run: python -m py_compile asterion_remote/security_scanner.py asterion_remote/control_v2_routes.py
  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile integrated VPN Java source
        working-directory: android
        run: gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac
