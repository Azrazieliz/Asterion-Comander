name: Control Browser atomic subscription cache — real JVM and Android source gates
on:
  push:
    branches:
      - fix/control-browser-atomic-filter-cache-20261126
      - work/control-non-ai-browser-20261126
      - work/control-non-ai-browser-permissions-20261126
      - work/control-non-ai-download-integration-20261126
      - work/control-non-ai-private-browser-20261126
      - work/control-non-ai-network-security-20261126
      - work/control-embedded-tor-reconciled-20261126
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'android/app/src/main/java/com/asterion/control/Browser*.java'
      - 'android/app/src/main/java/com/asterion/control/Tor*.java'
      - 'android/app/src/main/java/com/asterion/control/*Vpn*.java'
      - 'tests/java/com/asterion/control/Tor*.java'
      - 'android/app/src/main/java/com/asterion/control/ControlSecurityPolicy.java'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/build.gradle'
      - 'android/build.gradle'
      - 'android/app/proguard-rules.pro'
      - '.github/workflows/control-ai-source-gates.yml'
      - '.github/workflows/control-vpn-evidence-source-gates.yml'
      - 'tests/java/com/asterion/control/Browser*.java'
      - 'android/app/src/main/java/com/asterion/control/BrowserProtection.java'
      - 'tests/java/com/asterion/control/BrowserFilterCacheStoreTest.java'
      - '.github/workflows/control-browser-atomic-filter.yml'
  pull_request:
    branches:
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'android/app/src/main/java/com/asterion/control/Browser*.java'
      - 'android/app/src/main/java/com/asterion/control/Tor*.java'
      - 'android/app/src/main/java/com/asterion/control/*Vpn*.java'
      - 'tests/java/com/asterion/control/Tor*.java'
      - 'android/app/src/main/java/com/asterion/control/ControlSecurityPolicy.java'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/build.gradle'
      - 'tests/java/com/asterion/control/Browser*.java'
      - '.github/workflows/control-browser-atomic-filter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-cache-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile the real filter cache code without Android stubs
        run: |
          mkdir -p /tmp/asterion-browser-atomic-classes
          javac -encoding UTF-8 -d /tmp/asterion-browser-atomic-classes \
            android/app/src/main/java/com/asterion/control/BrowserFilterCacheStore.java \
            tests/java/com/asterion/control/BrowserFilterCacheStoreTest.java
          java -cp /tmp/asterion-browser-atomic-classes \
            com.asterion.control.BrowserFilterCacheStoreTest
      - name: Keep existing CSS filter contract regressions
        run: |
          javac -encoding UTF-8 -d /tmp/asterion-browser-atomic-classes \
            android/app/src/main/java/com/asterion/control/BrowserCosmeticFilters.java \
            tests/java/com/asterion/control/BrowserCosmeticFiltersTest.java
          java -cp /tmp/asterion-browser-atomic-classes \
            com.asterion.control.BrowserCosmeticFiltersTest
      - name: Execute Browser navigation and privacy regressions
        run: |
          javac -encoding UTF-8 -d /tmp/asterion-browser-atomic-classes \
            android/app/src/main/java/com/asterion/control/BrowserNavigationPolicy.java \
            android/app/src/main/java/com/asterion/control/TorAddressPolicy.java \
            android/app/src/main/java/com/asterion/control/TorRoutePolicy.java \
            tests/java/com/asterion/control/BrowserNavigationPolicyTest.java
          java -cp /tmp/asterion-browser-atomic-classes \
            com.asterion.control.BrowserNavigationPolicyTest
      - name: Execute signed transfer contract regressions
        run: |
          javac -encoding UTF-8 -cp /tmp/asterion-browser-atomic-classes -d /tmp/asterion-browser-atomic-classes \
            android/app/src/main/java/com/asterion/control/BrowserDownloadContract.java \
            tests/java/com/asterion/control/BrowserDownloadContractTest.java
          java -cp /tmp/asterion-browser-atomic-classes com.asterion.control.BrowserDownloadContractTest
      - name: Execute isolated Tor address and VPN route policy
        run: |
          javac -encoding UTF-8 -cp /tmp/asterion-browser-atomic-classes -d /tmp/asterion-browser-atomic-classes \
            android/app/src/main/java/com/asterion/control/VpnRouteScope.java \
            tests/java/com/asterion/control/TorAddressPolicyTest.java tests/java/com/asterion/control/TorRoutePolicyTest.java
          java -cp /tmp/asterion-browser-atomic-classes com.asterion.control.TorAddressPolicyTest
          java -cp /tmp/asterion-browser-atomic-classes com.asterion.control.TorRoutePolicyTest
  android-source-only:
    needs: browser-cache-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Ensure Android 37 platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$SDK/platforms/android-37.0/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --channel=3 'platforms;android-37.0' || true
          fi
          test -s "$SDK/platforms/android-37.0/android.jar"
      - name: Integrate Browser Java compilation without APK creation or installation
        working-directory: android
        run: gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac :app:processDebugMainManifest :app:mergeExtDexDebug
