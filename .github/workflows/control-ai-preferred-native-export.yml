name: Control preference-trained 7B native export
on:
  push:
    branches: [ai-candidate/preferred-7b-native-20261128]
    paths: ['.github/workflows/control-ai-preferred-native-export.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
jobs:
  export:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 4b77dee0524c64b8471869232e2958bd9589607d
          path: runtime
          persist-credentials: false
      - name: Restore exact verified DPO weights and pinned base metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/15243967683/zip" --output preferred.zip
          echo 'b012bdf6c6f9e324c8167507cb32f6a8fd654d48182299a2ab98c9bff2128e3c  preferred.zip' | sha256sum -c -
          python -m pip install huggingface-hub==0.34.4
          python -m scripts.control_ai_preferred_candidate preferred.zip retained
      - name: Convert actual preference-trained PEFT weights to native F16 GGUF
        run: |
          python -m pip install -r runtime/requirements/requirements-convert_lora_to_gguf.txt
          python -m pip install ./runtime/gguf-py
          python -m scripts.control_ai_native_adapter_export --candidate retained/candidate --base retained/base --runtime runtime --output native-preferred
      - name: Retain native adapter and exact training lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preferred-7b-native-f16
          retention-days: 30
          if-no-files-found: warn
          path: |
            native-preferred/
            retained/retained-lineage.json
            retained/candidate/candidate.json
