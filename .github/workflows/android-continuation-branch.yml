name: Android Control continuation branch acceptance
on:
  push:
    branches:
      - work/android-primary-continuation-observation-20261105
    paths:
      - 'android/**'
      - 'asterion_remote/**'
      - 'tests/**'
      - '.github/workflows/android-continuation-branch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Android-native API, MCP, fallback and existing Control tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests --basetemp=${{ runner.temp }}/asterion-pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision Android SDK 35 using available cmdline-tools
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MGR" ]; then MGR="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$MGR"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            yes | "$MGR" --sdk_root="$SDK" 'platforms;android-35' || true
          fi
          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$MGR" --sdk_root="$SDK" 'build-tools;35.0.0' || true
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -d "$SDK/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native APK (CI debug signer; not owner release key)
        working-directory: android
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Validate Android app identity and archive
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          grep -q "versionName '0.8.7'" android/app/build.gradle
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Asterion-Control-v0.8.7-CI-UNSIGNED-COMPATIBILITY-UNVERIFIED
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
