name: Control security and durable autonomy regressions
on:
  push:
    branches:
      - work/control-network-security-autonomy-20261126
      - work/control-native-ai-reconstruction-20261126
    paths:
      - 'asterion_remote/security_scanner.py'
      - 'asterion_remote/control_v2_routes.py'
      - 'asterion_remote/dev_backlog.py'
      - 'asterion_remote/overnight_supervisor.py'
      - 'scripts/control_ai_independent_dev.py'
      - 'asterion_remote/isolated_test_runner.py'
      - 'scripts/control_ai_autonomous_daemon.py'
      - 'tests/test_control_security_recovery.py'
      - 'tests/test_control_ai_dev_backlog.py'
      - 'tests/test_control_ai_executor.py'
      - 'tests/test_control_ai_daemon.py'
      - '.github/workflows/control-network-security-autonomy.yml'
permissions:
  contents: read
jobs:
  security-autonomy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi httpx
      - run: python -m pytest -q tests/test_control_security_recovery.py tests/test_browser_crawler.py tests/test_control_ai_dev_backlog.py tests/test_control_ai_daemon.py tests/test_overnight_supervisor.py tests/test_control_ai_executor.py tests/test_bridge_worker_lock.py
      - run: python -m py_compile asterion_remote/security_scanner.py asterion_remote/control_v2_routes.py asterion_remote/isolated_test_runner.py scripts/control_ai_autonomous_daemon.py
