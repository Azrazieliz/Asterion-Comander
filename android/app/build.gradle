plugins { id 'com.android.application' }

// The original Android 29 / compileSdk35 release configuration is preserved.
// The optional native GGUF engine is selected explicitly, never silently:
//   -PasterionNativeAi=true
// The published AiKit 1.0 AAR declares minSdk30/minCompileSdk37. Enabling it
// requires a separately authorized Android SDK/Gradle compatibility build.
def asterionNativeAi = (findProperty('asterionNativeAi') ?: 'false').toString() == 'true'

android {
  namespace 'com.asterion.control'
  compileSdk asterionNativeAi ? 37 : 35
  defaultConfig {
    applicationId 'com.asterion.control'
    minSdk asterionNativeAi ? 30 : 29
    targetSdk 35
    versionCode 931
    versionName '0.9.31'
  }
  // CI must explicitly use the original installed application's signing key.
  // Never silently substitute a runner-generated debug identity.
  signingConfigs {
    // Owner release is distinct from Gradle's debug build type. Android must
    // retain the ORIGINAL signing certificate for non-destructive upgrades.
    ownerRelease {
      def originalKey = System.getenv('ASTERION_OWNER_KEYSTORE_PATH')
      if (originalKey != null && !originalKey.trim().isEmpty()) {
        storeFile file(originalKey)
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
      }
    }
  }
  buildTypes {
    debug { debuggable true }
    release {
      // Real non-debuggable APK variant, signed with the installed app's
      // ORIGINAL certificate to preserve seamless in-place upgrades.
      // A new key would require uninstalling the existing application.
      debuggable false
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.ownerRelease
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
  if (asterionNativeAi) {
    packaging {
      // AiKit JNI bundles multiple native backends and depends on actual
      // extracted shared library paths; do not alter default APK packaging.
      jniLibs { useLegacyPackaging true }
    }
  }
}

// Official audited WireGuard GoBackend. VPN remains OFF until owner approval
// and a valid peer configuration; no third-party commercial service.
dependencies {
  implementation 'com.wireguard.android:tunnel:1.0.20260102'
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
  if (asterionNativeAi) {
    // MIT-licensed real JNI llama.cpp engine. Checked Maven Central 1.0.0
    // AAR and upstream Java-visible Kotlin API. Not required in default app.
    implementation 'io.github.its-hazratbilal:android-ai-kit-chat:1.0.0'
  }
}
